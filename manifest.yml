# nonk8s
# ClassIsland 插件清单
id: classisland.autopacker
name: ClassIsland 一键打包
description: 把整个 ClassIsland 程序目录（含 data 配置与插件）一键打包成 zip，输出到指定文件夹，用于备份或迁移到大屏。
entranceAssembly: "ClassIsland.AutoPacker.dll"
url: https://github.com/pioneer66679/classisland.autopacker
version: 1.0.2.0
apiVersion: 2.0.0.0
author: aaa人機課長
readme: README.md
icon: icon.png

# ---- 以下字段用于上架 ClassIsland 插件市场 ----
# 插件的 GitHub 仓库所有者
repoOwner: pioneer66679
# 插件的 GitHub 仓库名称
repoName: classisland.autopacker
# 插件资源根目录，格式为 <默认分支>/<插件项目相对存储库的路径>
assetsRoot: main
# Release 中插件包的工件名（.cipx 后缀）
artifactName: classisland.autopacker.cipx
# 仅在这些平台可用
supportedOSPlatforms:
  - Windows
